    helm:
      valueFiles: [../../envs/prod/releases/v0.4.0/v0.2.0-rc1/values.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: archi-crab}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 3, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
