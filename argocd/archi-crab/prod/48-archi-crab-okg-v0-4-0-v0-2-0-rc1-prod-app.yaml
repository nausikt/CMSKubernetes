kind: Application
metadata:
  name: archi-crab-okg-v0-4-0-v0-2-0-rc1-prod
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: archi-crab
  source:
    repoURL: https://github.com/nausikt/archi-crab-okg.git
    targetRevision: 66613e38d96d4fca7fba239c5f5b70f26d63eb19   # building: the release merge (E3); live: the deploy tag okg/prod/v0.4.0/v0.2.0-rc1. Never a branch.
