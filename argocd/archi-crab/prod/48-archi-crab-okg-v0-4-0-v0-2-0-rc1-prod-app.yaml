# archi-crab-okg, PROD, instance P = AKMON v0.4.0 (okg 5567c79a, public release) x corpus v0.2.0-rc1:
# THE prod instance of the two-instance model (archi-crab-okg docs/RELEASES.md "Two instances"),
# S's twin, built BESIDE the serving F (release archi-crab-okg) in namespace archi-crab, its own
# database on the node labelled archi-crab.cern.ch/okg=prod (12Gi guaranteed), volumes cinder-io1
