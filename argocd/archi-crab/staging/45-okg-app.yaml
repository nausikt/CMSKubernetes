# archi-crab-okg, staging, instance A = okg engine 43f459c6 x corpus v0.1.0 (archi-crab-okg
# releases/matrix.yaml). Served at /releases/43f459c6/v0.1.0/mcp and, while it is "latest",
# at /mcp. Rendered FROM the instance repo at an immutable release TAG (docs/RELEASES.md);
# this file only points at it. Application name == fullnameOverride (kept from the
# pre-release layout: renaming it would rename its volumes).
# Wave 4: after platform (namespace) and before mcp-gateway (5), whose okg
# MCPRemoteProxy fronts this app's mcp Service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: archi-crab-okg-staging
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: archi-crab
  source:
    repoURL: https://github.com/nausikt/archi-crab-okg.git
    targetRevision: okg/releases/43f459c6/v0.1.0   # a tag, never a branch
    path: helm/okg
    helm:
      valueFiles: [../../envs/releases/43f459c6/v0.1.0/values.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: archi-crab-staging}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 3, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
  # Degraded while the worker probe cannot pass (upstream okg readiness bug) is
  # REAL -- no ignoreDifferences / health overrides to hide it.
