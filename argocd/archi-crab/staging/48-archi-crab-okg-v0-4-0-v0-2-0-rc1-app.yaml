# archi-crab-okg, staging, instance S = AKMON v0.4.0 (okg's first public release, commit 5567c79a)
# x corpus v0.2.0-rc1: THE staging instance of the two-instance model (archi-crab-okg
# docs/RELEASES.md "Two instances"), its database on the node labelled archi-crab.cern.ch/okg=staging
# (12Gi guaranteed), two cinder-io1-delete volumes. Served at /releases/v0.4.0/v0.2.0-rc1/mcp;
# staging /mcp + the vMCP backend move here at cutover C1, then D retires (C3). BUILDING from the
# release merge 66613e38d96d4fca7fba239c5f5b70f26d63eb19 (E3). Secret okg-archi-crab-v0-4-0-v0-2-0-rc1. Fixed ClusterIP 10.254.0.207.
# Built FROM SCRATCH: the 0.3.0 -> 0.4.0 database migrations never run on a serving database.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: archi-crab-okg-v0-4-0-v0-2-0-rc1
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: archi-crab
  source:
    repoURL: https://github.com/nausikt/archi-crab-okg.git
    targetRevision: 66613e38d96d4fca7fba239c5f5b70f26d63eb19   # building: the release merge (archi-crab-okg E3); live: the deploy tag okg/releases/v0.4.0/v0.2.0-rc1. Never a branch.
    path: helm/okg
    helm:
      valueFiles: [../../envs/releases/v0.4.0/v0.2.0-rc1/values.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: archi-crab-staging}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 3, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
