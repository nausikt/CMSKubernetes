# archi v2 benchmark fixture, staging, engine archi-aa42e2a2 x corpus v0.2.0-rc1 (release archi-v2-v0-2-0-rc1,
# its own Secret and volumes, next to archi-v2 = v0.1.0). Served at archi-crab-v2.cern.ch
# /{grep,vectorstore}/releases/v0.2.0-rc1/mcp. BUILDING from 1168718 (rebuild PR v2/rc1-rebuild: ingest = the corpus snapshot e2020305, pins d74269e; the chart there
# names this release's own Services; the weblist is corpus v0.2.0-rc1's).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: archi-v2-v0-2-0-rc1
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: archi-crab
  source:
    repoURL: https://github.com/nausikt/archi-crab-okg.git
    targetRevision: 1168718c38092440d66df4f20c8e279a03cfcea4   # building: the rebuild sha (v2/rc1-rebuild); live: the deploy tag. Never a branch.
    path: v2/helm/archi-v2
    helm:
      valueFiles: [../../envs/releases/v0.2.0-rc1/values.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: archi-crab-staging}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 3, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
