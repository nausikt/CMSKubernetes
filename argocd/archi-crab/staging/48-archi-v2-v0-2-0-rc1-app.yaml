# archi v2 benchmark fixture, staging, engine archi-e6609f8f x corpus v0.2.0-rc1 (release archi-v2-v0-2-0-rc1,
# its own Secret and volumes, next to archi-v2 = v0.1.0). Served at archi-crab-v2.cern.ch
# /{grep,vectorstore}/releases/v0.2.0-rc1/mcp. BUILDING from the build merge 96bf698 (the chart there
# names this release's own Services; the weblist is corpus v0.2.0-rc1's).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: archi-v2-v0-2-0-rc1
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: archi-crab
  source:
    repoURL: https://github.com/nausikt/archi-crab-okg.git
    targetRevision: 96bf698fd207731c89103a9d72c28a556d62ced5   # building: the build merge (archi-crab-okg #48); live: the deploy tag. Never a branch.
    path: v2/helm/archi-v2
    helm:
      valueFiles: [../../envs/releases/v0.2.0-rc1/values.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: archi-crab-staging}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: 3, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
