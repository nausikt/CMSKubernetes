apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    # NOTE: host-network mode is a CLUSTER-WIDE Cilium setting
    # (gatewayAPI.hostNetwork.enabled in cilium-config), not a per-Gateway
    # annotation. There is nothing to set here -- an earlier revision of this
    # chart carried an invented `io.cilium/gateway-host-network` annotation.
    # See cluster/CLUSTER.md for the real mechanism.
  labels:
    app.kubernetes.io/part-of: archi-crab
    archi-crab.cern.ch/scope: edge
spec:
  gatewayClassName: {{ .Values.className }}
  # NO spec.addresses. There is no VIP to pin; the address is whatever the
  # nodes have, and LanDB already knows it.
  listeners:
{{- range $i, $l := .Values.listeners }}
    - name: https-{{ $i }}
      protocol: HTTPS
      port: 443
      hostname: {{ $l.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          # Resolved in THIS namespace. All five certs live here.
          - kind: Secret
            name: {{ $l.tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: archi-crab
{{- if $l.env }}
              # PER-LISTENER isolation: this is what replaces having separate
              # Gateways. A namespace labelled env={{ $l.env }} and nothing else
              # may claim this hostname.
              archi-crab.cern.ch/env: {{ $l.env }}
{{- else if $l.scope }}
              archi-crab.cern.ch/scope: {{ $l.scope }}
{{- end }}
{{- end }}
