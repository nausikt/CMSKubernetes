apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    # Belt and braces on top of the app's prune:false: deleting this Gateway
    # deletes the Cilium-owned LoadBalancer Service, which deletes the Octavia
    # LB and frees the VIP every LanDB alias points at.
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    app.kubernetes.io/part-of: archi-crab
    archi-crab.cern.ch/scope: edge
spec:
  gatewayClassName: {{ .Values.className }}
{{- with .Values.vip }}
  # Pin the Octavia VIP: Cilium copies this to the Service's loadBalancerIP,
  # so a recreate requests the same address. Verify after any change:
  #   kubectl -n archi-crab-gw get svc cilium-gateway-archi-crab \
  #     -o jsonpath='{.spec.loadBalancerIP} {.status.loadBalancer.ingress[0].ip}'
  addresses:
    - type: IPAddress
      value: {{ . | quote }}
{{- end }}
  listeners:
{{- range $i, $l := .Values.listeners }}
    - name: https-{{ $i }}
      protocol: HTTPS
      port: 443
      hostname: {{ $l.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          # Resolved in THIS namespace. All the host certs live here.
          - kind: Secret
            name: {{ $l.tlsSecret }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: archi-crab
{{- if $l.env }}
              # PER-LISTENER isolation: this is what replaces having separate
              # Gateways. A namespace labelled env={{ $l.env }} and nothing else
              # may claim this hostname.
              archi-crab.cern.ch/env: {{ $l.env }}
{{- else if $l.scope }}
              archi-crab.cern.ch/scope: {{ $l.scope }}
{{- end }}
{{- end }}
