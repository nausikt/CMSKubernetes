apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: archi-crab
    # NO env label. This namespace is the shared edge and must not match any
    # listener's own selector -- otherwise it could attach routes to itself.
    archi-crab.cern.ch/scope: edge
    pod-security.kubernetes.io/enforce: baseline
