{{- $n := include "archi.name" (dict "base" "litellm" "ctx" $) }}
{{- $otel := include "archi.name" (dict "base" .Values.telemetry.collectorBase "ctx" $) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}-config
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
  labels:
{{ include "archi.labels" . | indent 4 }}
data:
  config.yaml: |
{{ include "litellm.config" . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
  labels:
{{ include "archi.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  # Every change rolls without a gap: the new pod takes traffic only once LiteLLM answers /health/readiness, and
  # the old one keeps serving until then, then finishes its in-flight calls (the relay's evaluation calls run
  # for minutes: terminationGracePeriodSeconds) before it exits.
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: {{ $n }}}}
  template:
    metadata:
      labels:
        app: {{ $n }}
{{ include "archi.labels" . | indent 8 }}
      annotations:
        checksum/config: {{ include "litellm.config" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
{{ include "archi.podSecurityContext" . | indent 8 }}
      containers:
        - name: litellm
          securityContext:
{{ include "archi.containerSecurityContext" . | indent 12 }}
          image: {{ .Values.image }}{{ with .Values.imageDigest }}@{{ . }}{{ end }}
          args: ["--config", "/conf/config.yaml", "--port", "4000"]
          envFrom: [{secretRef: {name: {{ .Values.secretName }}}}]
          env:
{{- if .Values.telemetry.otel }}
            - {name: LITELLM_OTEL_V2, value: "true"}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ $otel }}.{{ .Values.namespace }}.svc.cluster.local:4318"
{{- end }}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment={{ .Values.env }}"}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: litellm-keys, key: OPENWEBUI_VIRTUAL_KEY}
          ports: [{containerPort: 4000}]
          # Readiness only, on purpose: a liveness probe that times out while LiteLLM is busy would kill
          # in-flight evaluation calls. /health/readiness needs no key.
          readinessProbe:
            httpGet: {path: /health/readiness, port: 4000}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 1, memory: 1Gi}
          volumeMounts:
            - {name: conf, mountPath: /conf}
            # readOnlyRootFilesystem: true needs writable scratch
            - {name: scratch, mountPath: /tmp}
      volumes:
        - {name: scratch, emptyDir: {}}
        - name: conf
          configMap: {name: {{ $n }}-config}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
  labels:
{{ include "archi.labels" . | indent 4 }}
spec:
  selector: {app: {{ $n }}}
  ports: [{port: 4000, targetPort: 4000}]
