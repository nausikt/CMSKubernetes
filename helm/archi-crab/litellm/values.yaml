# SKELETON -- model routing is yours to fill in.
# ONE PER ENVIRONMENT (D-D): config.yaml is precisely what non-prod is for.
env: prod
nameSuffix: ""
namespace: archi-crab

image: ghcr.io/berriai/litellm:main-stable
# main-stable moves: a restart can upgrade LiteLLM. Pin the digest this environment runs (tested), from
#   kubectl -n <namespace> get pod -l app=<litellm|litellm-staging> -o jsonpath='{.items[0].status.containerStatuses[0].imageID}'
# (the sha256:... part). Empty: the moving tag.
imageDigest: ""
replicas: 1
# The old pod finishes its in-flight calls before it exits (the relay's timeout is 900 s).
terminationGracePeriodSeconds: 900
# Made by hand (kubectl; the Vault apps are disabled), every LiteLLM key in this one Secret: OPENAI_API_KEY,
# OPENWEBUI_VIRTUAL_KEY (also LiteLLM's master key), AIGW_SANDBOX_KEY (key archi-crab-sandbox: the CERN-hosted AIGW
# models) and, in staging, AIGW_DEV_KEY (key archi-crab-dev: FLATIRON). The AIGW keys: scripts/aigw-keys.sh (adds
# them, leaves the others). A changed key reaches LiteLLM at its next restart (kubectl rollout restart, between runs).
# When Vault comes back (helm/archi-crab/vault), its <env>/litellm-keys must hold all of them: VSO rewrites the Secret.
secretName: litellm-keys

telemetry:
  otel: true
  # Points at THIS environment's collector; the name tracks nameSuffix.
  collectorBase: otel-collector
  # NOTE: LiteLLM's native Prometheus callback may be Enterprise-gated; sources
  # conflict (F22). The OTel path is unaffected, which is why it is primary.


models:
  - model_name: gpt-5-luna
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY

  # Ollama on a MIT submit node. LiteLLM talks to it as an OpenAI-compatible
  # endpoint, so the model string keeps the openai/ prefix and api_base points
  # at Ollama's /v1 shim. Ollama has no auth; api_key is a placeholder LiteLLM
  # requires but Ollama ignores.
  - model_name: qwen38-27b
    litellm_params:
      model: openai/qwen3.8:27B
      api_base: http://submit76.mit.edu:7870/v1
      api_key: "ollama"

  # --- CERN AI gateway (aigw.cern.ch: CERN's LiteLLM proxy; reachable from the CERN network only; public TLS) ---
  # Hosted AT CERN. Names are AIGW's own. AIGW_SANDBOX_KEY from Secret litellm-keys (scripts/aigw-keys.sh).
  # timeout = the relay's 900 s. allowed_openai_params: drop_params must not drop reasoning_effort for these.
  - model_name: qwen3.8-27b-fp16
    litellm_params: {model: openai/qwen3.8-27b-fp16, api_base: "https://aigw.cern.ch/v1", api_key: os.environ/AIGW_SANDBOX_KEY, timeout: 900}
  - model_name: glm-5.3-flash-int4
    litellm_params: {model: openai/glm-5.3-flash-int4, api_base: "https://aigw.cern.ch/v1", api_key: os.environ/AIGW_SANDBOX_KEY, timeout: 900, allowed_openai_params: [reasoning_effort]}
  - model_name: gpt-oss-20b
    litellm_params: {model: openai/gpt-oss-20b, api_base: "https://aigw.cern.ch/v1", api_key: os.environ/AIGW_SANDBOX_KEY, timeout: 900, allowed_openai_params: [reasoning_effort]}
  - model_name: e5-large-v2
    litellm_params: {model: openai/e5-large-v2, api_base: "https://aigw.cern.ch/v1", api_key: os.environ/AIGW_SANDBOX_KEY}
    model_info: {mode: embedding}
  - model_name: embeddinggemma-300m
    litellm_params: {model: openai/embeddinggemma-300m, api_base: "https://aigw.cern.ch/v1", api_key: os.environ/AIGW_SANDBOX_KEY}
    model_info: {mode: embedding}

defaultModel: gpt-5-luna
