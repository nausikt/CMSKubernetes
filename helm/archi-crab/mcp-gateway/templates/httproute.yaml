{{- /*
One HTTPRoute per vMCP. Backends have no public hostname at all -- that is
the vMCP dividend: adding MCP #4 and #5 costs zero hostnames. Adding a CLIENT
FAMILY costs one, because it means one more audience (see vmcp.yaml).
*/}}
{{- range $v := .Values.vmcps }}
{{- if not $v.internal }}
{{- $n := include "archi.name" (dict "base" $v.name "ctx" $) }}
{{- $path := include "archi.vmcpPath" (dict "v" $v "ctx" $) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $n }}
  namespace: {{ $.Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  labels:
{{ include "archi.labels" $ | indent 4 }}
    archi-crab.cern.ch/vmcp: {{ $v.name }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.baseName }}
      namespace: {{ $.Values.gateway.namespace }}
  hostnames:
    - {{ $v.host | quote }}
  rules:
{{- if $path }}
    # RELEASE path (vmcp.yaml): RFC 9728 path-aware discovery for THIS vMCP,
    # then <path>/... with the prefix rewritten away (the vMCP serves /mcp).
    # Longest-prefix match keeps the path-less "latest" vMCP's catch-all intact.
    - matches:
        - path: {type: Exact, value: "/.well-known/oauth-protected-resource{{ $path }}/mcp"}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /.well-known/oauth-protected-resource}
      backendRefs:
        - {name: vmcp-{{ $n }}, port: {{ $.Values.vmcp.servicePort }}}
    - matches:
        - path: {type: PathPrefix, value: {{ $path | quote }}}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - {name: vmcp-{{ $n }}, port: {{ $.Values.vmcp.servicePort }}}
      timeouts:
        backendRequest: {{ $.Values.gateway.timeout }}
        request: {{ $.Values.gateway.timeout }}
{{- else }}
    - backendRefs:
        # The operator names the Service vmcp-<cr-name> and assigns port 4483
        # (same across instances so far -- your colleague's Route hardcodes it
        # too). Confirm on first sync: kubectl -n <ns> get svc | grep vmcp
        - name: vmcp-{{ $n }}
          port: {{ $.Values.vmcp.servicePort }}
      # MCP holds long-lived streaming connections. The default timeout drops
      # SSE mid-session and tools/list still passes, so it hides from smoke tests.
      timeouts:
        backendRequest: {{ $.Values.gateway.timeout }}
        request: {{ $.Values.gateway.timeout }}
{{- end }}
{{- end }}
{{- end }}
