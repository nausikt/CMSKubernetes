{{- $n := include "archi.name" (dict "base" .Values.vmcp.name "ctx" $) }}
# ONE route for the whole stack. Backends have no public hostname at all --
# that is the vMCP dividend: adding MCP #4 and #5 costs zero hostnames,
# zero certificates and zero CERN registrations.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $n }}
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  labels:
{{ include "archi.labels" . | indent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.baseName }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.vmcp.host | quote }}
  rules:
    - backendRefs:
        # The operator prefixes the Service with "vmcp-" and assigns its own
        # port -- neither matches the CR name or spec.port. Confirm with:
        #   kubectl -n <ns> get svc | grep vmcp
        - name: vmcp-{{ $n }}
          port: {{ .Values.vmcp.servicePort }}
      # MCP holds long-lived streaming connections. The default timeout drops
      # SSE mid-session and tools/list still passes, so it hides from smoke tests.
      timeouts:
        backendRequest: {{ .Values.gateway.timeout }}
        request: {{ .Values.gateway.timeout }}
