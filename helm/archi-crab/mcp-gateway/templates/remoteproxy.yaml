{{- /*
STANDALONE REMOTE GATEWAYS. Each entry fronts an existing MCP URL (in-cluster
or remote) with a ToolHive MCPRemoteProxy that owns its OWN hostname, audience
and Cedar policy -- no vMCP, no group. Used first for archi-crab-okg
(archi-crab-okg-staging.cern.ch -> the okg runtime's mcp Service).
Shapes verified 2026-09-16 (kubectl explain mcpremoteproxy.spec): remoteUrl,
transport, proxyPort, oidcConfigRef, externalAuthConfigRef, allowPrivateEndpoint.
All v1beta1; shapes confirmed by server dry-run 2026-09-21. Still gated: the proxy Service name.

PATHS (2026-10-04). An entry may set `path` (e.g. /run1, /grep): several proxies then share
ONE hostname, one path prefix each -- no LanDB alias, cert or listener per endpoint:
  https://<host><path>/mcp                                   -> this proxy's /mcp (prefix rewritten away)
  https://<host>/.well-known/oauth-protected-resource<path>/mcp -> this proxy's /.well-known/oauth-protected-resource
The second rule is RFC 9728 path-aware discovery (what MCP clients try first for a resource
that has a path); resourceUrl carries the full public URL, so the document's `resource` is
what the client connected to. An entry WITHOUT `path` keeps the catch-all `/` rule; Gateway
API's longest-prefix match lets path entries (and other charts' routes, e.g. the okg
console at /akmon) coexist with it on the same hostname.
`enabled: false` keeps an entry in values without rendering it (an upstream not deployed yet).
*/}}
{{- range $p := .Values.remoteProxies }}
{{- if ne $p.enabled false }}
{{- $n := include "archi.name" (dict "base" $p.name "ctx" $) }}
{{- $path := ($p.path | default "") | trimSuffix "/" }}
{{- $svc := $p.service | default (printf "mcp-%s-remote-proxy" $n) }}
---
apiVersion: {{ $.Values.apiVersions.mcpOIDCConfig }}
kind: MCPOIDCConfig
metadata:
  name: {{ include "archi.name" (dict "base" (printf "cern-%s" $p.name) "ctx" $) }}
  namespace: {{ $.Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
  labels:
{{ include "archi.labels" $ | indent 4 }}
spec:
  type: inline
  inline:
    issuer: {{ $.Values.cern.issuer | quote }}
    jwksUrl: {{ $.Values.cern.jwksUri | quote }}
    clientId: {{ $p.audience | quote }}
{{- if $p.policies }}
---
apiVersion: {{ $.Values.apiVersions.mcpAuthzConfig }}
kind: MCPAuthzConfig
metadata:
  name: {{ $n }}-cedar
  namespace: {{ $.Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  labels:
{{ include "archi.labels" $ | indent 4 }}
spec:
  # v1beta1 shape (docs.stacklok.com/toolhive/reference/crds/mcpauthzconfig):
  # generic `config`, contents keyed by type. Verified by server dry-run.
  type: cedarv1
  config:
    entities_json: "[]"
    policies:
{{- range $p.policies }}
      - |
{{ . | indent 8 }}
{{- end }}
{{- end }}
---
apiVersion: {{ $.Values.apiVersions.mcpRemoteProxy }}
kind: MCPRemoteProxy
metadata:
  name: {{ $n }}
  namespace: {{ $.Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
  labels:
{{ include "archi.labels" $ | indent 4 }}
spec:
  remoteUrl: {{ $p.url }}
  transport: streamable-http
  proxyPort: 8080
{{- if $p.private }}
  allowPrivateEndpoint: true          # in-cluster upstream (okg mcp Service)
{{- end }}
  oidcConfigRef:
    name: {{ include "archi.name" (dict "base" (printf "cern-%s" $p.name) "ctx" $) }}
    audience: {{ $p.audience | quote }}       # required on the ref (dry-run confirmed)
    resourceUrl: "https://{{ $p.host }}{{ $path }}/mcp"  # OAuth discovery for Claude Code / inspector
{{- if $p.policies }}
  authzConfigRef:
    name: {{ $n }}-cedar
{{- end }}
  audit: {enabled: true}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits:   {cpu: 200m, memory: 256Mi}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $n }}
  namespace: {{ $.Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  labels:
{{ include "archi.labels" $ | indent 4 }}
spec:
  parentRefs:
    - {name: archi-crab, namespace: archi-crab-gw}
  hostnames: [{{ $p.host | quote }}]
  rules:
{{- if $path }}
    - matches:
        - path: {type: Exact, value: "/.well-known/oauth-protected-resource{{ $path }}/mcp"}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /.well-known/oauth-protected-resource}
      backendRefs:
        - {name: {{ $svc }}, port: 8080}
    - matches:
        - path: {type: PathPrefix, value: {{ $path | quote }}}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - {name: {{ $svc }}, port: 8080}
      timeouts: {backendRequest: 3600s, request: 3600s}
{{- else }}
    - backendRefs:
        - name: {{ $svc }}   # operator naming, confirmed 2026-09-21
          port: 8080
      timeouts: {backendRequest: 3600s, request: 3600s}
{{- end }}
{{- end }}
{{- end }}
