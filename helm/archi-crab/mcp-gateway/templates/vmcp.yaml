{{- /*
ONE VirtualMCPServer PER AUDIENCE, all fronting the same MCPGroup.

WHY A LIST: oidcConfigRef.audience is a single string, and the CRD says it
"MUST be unique per server to prevent token replay attacks". Two client
families produce two audiences:

  Claude Code / mcp-inspector  ->  public client   -> aud=crab-mcp-gateway-public[-staging]
  OpenWebUI (system_oauth)     ->  confidential    -> aud=archi-crab-[production|staging]

Nothing in the chain converts one to the other: OpenWebUI forwards tokens
verbatim (all four auth_type values, read from routers/configs.py), and
ToolHive 0.47.0 has no exchange hook on the INCOMING leg
(MCPExternalAuthConfig is outgoing-only). So: one vMCP per audience, same
backends, one extra hostname and cert. No new CERN app.

Operator 0.47.0 quirks, all found by apply and all still true:
  - incomingAuth.type enum is anonymous|oidc; "local" is documented, not implemented
  - oidcConfigRef is REQUIRED when type is oidc; inline `oidc:` is rejected (CEL)
  - source: discovered self-populates a backends map with type:
    externalAuthConfigRef using each MCPServer's oidcConfigRef name -- a
    different kind, so it 404s. The explicit map below pins type: discovered.
  - the Service is vmcp-<name> on port 4483, not spec.port (see httproute.yaml)
*/}}
{{- range $v := .Values.vmcps }}
{{- $n := include "archi.name" (dict "base" $v.name "ctx" $) }}
---
apiVersion: {{ $.Values.apiVersions.virtualMCPServer }}
kind: VirtualMCPServer
metadata:
  name: {{ $n }}
  namespace: {{ $.Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
  labels:
{{ include "archi.labels" $ | indent 4 }}
    archi-crab.cern.ch/vmcp: {{ $v.name }}
spec:
  groupRef:
    name: {{ include "archi.name" (dict "base" $.Values.group.name "ctx" $) }}

  incomingAuth:
    type: oidc
    oidcConfigRef:
      # Per-vMCP MCPOIDCConfig (oidc-config.yaml) -- issuer and JWKS are the
      # same CERN realm for both; only the audience differs, and it is set here.
      name: {{ include "archi.name" (dict "base" (printf "cern-%s" $v.name) "ctx" $) }}
      audience: {{ $v.audience | quote }}
      # Advertised in OAuth discovery. Bare :443 via the Octavia LB -- a port
      # here would point clients at an address that no longer answers.
      resourceUrl: "https://{{ $v.host }}/mcp"

  outgoingAuth:
    source: discovered
    backends:
{{- range $.Values.vmcp.backends }}
      {{ include "archi.name" (dict "base" . "ctx" $) }}:
        type: discovered
{{- end }}
{{- if $.Values.authz.enabled }}
  authzConfigRef:
    name: {{ include "archi.name" (dict "base" "cedar" "ctx" $) }}
{{- end }}
{{- end }}
