{{- $n := include "archi.name" (dict "base" .Values.vmcp.name "ctx" $) }}
# The only public surface. One hostname, one CERN client, one redirect URI,
# one Cedar policy, one aggregated tool list.
#
# TODO verify every field name against your operator build:
#   kubectl explain virtualmcpserver.spec --recursive
apiVersion: {{ .Values.apiVersions.virtualMCPServer }}
kind: VirtualMCPServer
metadata:
  name: {{ $n }}
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
  labels:
{{ include "archi.labels" . | indent 4 }}
spec:
  groupRef:
    name: {{ include "archi.name" (dict "base" .Values.group.name "ctx" $) }}

  incomingAuth:
    type: {{ .Values.vmcp.incomingAuthType }}
{{- if eq .Values.vmcp.incomingAuthType "oidc" }}
    # A REFERENCE to an MCPOIDCConfig -- the CEL rule requires it when type is
    # oidc, and inline settings are rejected. cern-replayed-staging already
    # validates this exact token: iss=auth.cern.ch, aud=crab-mcp-gateway-staging.
    oidcConfigRef:
      name: {{ include "archi.name" (dict "base" "cern-replayed" "ctx" $) }}
      # Required by the CRD. The client presents a CERN token minted for the
      # vMCP's upstream client, so aud = cern.clientId.
      audience: {{ .Values.cern.clientId | quote }}
      # Advertised in OAuth discovery. Carries the NodePort, or clients are
      # pointed at an address that does not answer.
      resourceUrl: "https://{{ .Values.vmcp.host }}:{{ .Values.vmcp.publicPort }}/mcp"
{{- end }}
  outgoingAuth:
    source: {{ .Values.vmcp.backendDiscovery }}
    # `default` omitted: with incomingAuth oidc the client's CERN token reaches
    # the backends unchanged. Setting default.type: discovered makes the vMCP
    # resolve each backend's auth config as an MCPExternalAuthConfig, using the
    # name from oidcConfigRef -- which is a different kind, so it 404s and the
    # vMCP goes Failed. Operator 0.47.0.

{{- if eq .Values.vmcp.incomingAuthType "local" }}
  authServerConfig:
    issuer: {{ .Values.vmcp.authServer.issuer | quote }}
    # BOTH refs required in practice. Signing keys sign the JWTs; HMAC secrets
    # decode authorization codes and refresh tokens. Omit either and ToolHive
    # auto-generates EPHEMERAL keys -- every pod restart invalidates all tokens
    # and forces every user to re-authenticate.
    signingKeySecretRefs:
      - name: {{ .Values.vmcp.authServer.signingKeySecret.name }}
        key: {{ .Values.vmcp.authServer.signingKeySecret.key }}
    hmacSecretRefs:
      - name: {{ .Values.vmcp.authServer.hmacSecret.name }}
        key: {{ .Values.vmcp.authServer.hmacSecret.key }}
    tokenLifespans:
{{ toYaml .Values.vmcp.authServer.tokenLifespans | indent 6 }}
    upstreamProviders:
      # ONE provider = one login. Multiple providers chain sequentially and the
      # user is redirected to each in turn.
      - name: cern
        type: oidc
        oidcConfig:
          issuerUrl: {{ .Values.cern.issuer | quote }}
          clientId: {{ .Values.cern.clientId | quote }}
          clientSecretRef:
            name: {{ .Values.cern.clientSecret.secretName }}
            key: {{ .Values.cern.clientSecret.key }}
          scopes: {{ .Values.cern.scopes | toJson }}
{{- end }}

{{- if .Values.authz.enabled }}
  authzConfigRef:
    name: {{ include "archi.name" (dict "base" "cedar" "ctx" $) }}
{{- end }}
