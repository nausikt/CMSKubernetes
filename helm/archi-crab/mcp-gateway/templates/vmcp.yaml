{{- /*
ONE VirtualMCPServer PER AUDIENCE (and per bundle RELEASE), each fronting one MCPGroup.

RELEASES (2026-10-16): see _helpers.tpl "archi.vmcpRelease". A release vMCP shares its
host with the "latest" one at the root, on /releases/<version> -- same mechanism as
remoteproxy.yaml: the route strips the prefix, and an Exact rule serves this vMCP's
RFC 9728 document at /.well-known/oauth-protected-resource<path>/mcp.

WHY A LIST: oidcConfigRef.audience is a single string, and the CRD says it
"MUST be unique per server to prevent token replay attacks". Two client
families produce two audiences:

  Claude Code / mcp-inspector  ->  public client   -> aud=crab-mcp-gateway-public[-staging]
  OpenWebUI (system_oauth)     ->  confidential    -> aud=archi-crab-[production|staging]

Nothing in the chain converts one to the other: OpenWebUI forwards tokens
verbatim (all four auth_type values, read from routers/configs.py), and
ToolHive 0.47.0 has no exchange hook on the INCOMING leg
(MCPExternalAuthConfig is outgoing-only). So: one vMCP per audience, same
backends, one extra hostname and cert. No new CERN app.

Operator 0.47.0 quirks, all found by apply and all still true:
  - incomingAuth.type enum is anonymous|oidc; "local" is documented, not implemented
  - oidcConfigRef is REQUIRED when type is oidc; inline `oidc:` is rejected (CEL)
  - source: discovered self-populates a backends map with type:
    externalAuthConfigRef using each MCPServer's oidcConfigRef name -- a
    different kind, so it 404s. The explicit map below pins type: discovered.
  - the Service is vmcp-<name> on port 4483, not spec.port (see httproute.yaml)
*/}}
{{- range $v := .Values.vmcps }}
{{- $n := include "archi.name" (dict "base" $v.name "ctx" $) }}
{{- $relName := include "archi.vmcpRelease" (dict "v" $v "ctx" $) }}
{{- $path := include "archi.vmcpPath" (dict "v" $v "ctx" $) }}
{{- $group := $v.group | default $.Values.group.name }}
{{- $authzSet := $v.authzSet | default "default" }}
{{- $backends := $v.backends | default $.Values.vmcp.backends }}
{{- $fp := "" }}
{{- if $relName }}
{{- $rel := index $.Values.bundles.releases $relName }}
{{- $group = $rel.group }}
{{- $authzSet = $rel.authzSet }}
{{- /* release `backends` honours an explicit [] (the legacy `default` cannot) */}}
{{- $backends = hasKey $rel "backends" | ternary $rel.backends $.Values.vmcp.backends }}
{{- if not (hasKey $.Values.authz.sets $authzSet) }}
{{- fail (printf "bundles.releases.%s.authzSet %q: no authz.sets.%s" $relName $authzSet $authzSet) }}
{{- end }}
{{- $fp = include "archi.bundleFingerprint" (dict "ctx" $ "release" $relName) }}
{{- if $rel.frozen }}
{{- /* FREEZE GUARD: a frozen release renders only while its members are unchanged */}}
{{- range $s := $.Values.servers }}
{{- if and (eq ($s.group | default $.Values.group.name) $group) (not (contains "@sha256:" $s.image)) }}
{{- fail (printf "bundle %s is frozen but servers[%s].image %q is a tag: pin it by digest (tags move)" $relName $s.name $s.image) }}
{{- end }}
{{- end }}
{{- if ne (toString $rel.frozen) $fp }}
{{- fail (printf "bundle %s is FROZEN at %s but its members now hash to %s. A frozen release does not change: cut a new release (new group) for the change, or -- deliberately -- re-freeze with the new value." $relName (toString $rel.frozen) $fp) }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: {{ $.Values.apiVersions.virtualMCPServer }}
kind: VirtualMCPServer
metadata:
  name: {{ $n }}
  namespace: {{ $.Values.namespace }}
{{- if $relName }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    archi-crab.cern.ch/bundle-fingerprint: {{ $fp | quote }}
{{- else }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
{{- end }}
  labels:
{{ include "archi.labels" $ | indent 4 }}
    archi-crab.cern.ch/vmcp: {{ $v.name }}
{{- if $relName }}
    archi-crab.cern.ch/release: {{ $relName | quote }}
{{- end }}
spec:
  groupRef:
    name: {{ include "archi.name" (dict "base" $group "ctx" $) }}
{{- $res := $v.resources | default $.Values.vmcp.resources }}
{{- $pool := $.Values.mcpPool | default dict }}
{{- $reps := $v.replicas | default 0 | int }}
{{- $sess := $.Values.vmcpSessions | default dict }}
{{- if and (gt $reps 1) (not $sess.enabled) }}
{{- fail (printf "vmcps[%s].replicas %d needs vmcpSessions.enabled: without shared sessions a request on the other pod gets 404" $v.name $reps) }}
{{- end }}
{{- if gt $reps 0 }}

  # SCALE-OUT (2026-11-02). Replicas > 1 only with Redis-backed sessions: a session made on one pod is
  # found by the other, and a restarting pod no longer drops every session (the reconnect storm that
  # OOM-killed the release vMCP on 2026-11-01). sessionAffinity None: all traffic reaches the vMCP from
  # the gateway's Envoy, so ClientIP affinity would pin everything to one pod. Unset replicas = 1 pod.
  replicas: {{ $reps }}
{{- end }}
{{- if gt $reps 1 }}
  sessionAffinity: None
  sessionStorage:
    provider: redis
    address: {{ printf "%s.%s.svc.cluster.local:6379" (include "archi.name" (dict "base" "redis-vmcp-sessions" "ctx" $)) $.Values.namespace | quote }}
    keyPrefix: {{ printf "vmcp:%s:" $n | quote }}
    passwordRef: {name: {{ $sess.authSecret }}, key: password}
{{- end }}
{{- if or $res $pool.key (gt $reps 1) }}

  # The vMCP pod: our label (the disruption budget and the spread select on it), placement on the
  # MCP pool, one replica per node, and the `vmcp` container's resources (vmcps[].resources, else
  # vmcp.resources; operator defaults were 100m/128Mi .. 500m/512Mi, OOM-killed 17 times under eval
  # load, 2026-10-16 .. 11-01). A change here rolls the vMCP pods: between runs only.
  podTemplateSpec:
    metadata:
      labels:
        archi-crab.cern.ch/vmcp-pod: {{ $n }}
    spec:
{{- with include "archi.mcpPlacement" (dict "ctx" $ "indent" 6) }}
{{ . }}
{{- end }}
{{- if gt $reps 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {archi-crab.cern.ch/vmcp-pod: {{ $n }}}
{{- end }}
{{- if $res }}
      containers:
        - name: vmcp
          resources:
{{ toYaml $res | indent 12 }}
{{- end }}
{{- end }}

  incomingAuth:
    type: oidc
    oidcConfigRef:
      # Per-vMCP MCPOIDCConfig (oidc-config.yaml) -- issuer and JWKS are the
      # same CERN realm for both; only the audience differs, and it is set here.
      name: {{ include "archi.name" (dict "base" (printf "cern-%s" $v.name) "ctx" $) }}
      audience: {{ $v.audience | quote }}
      # Advertised in OAuth discovery. Bare :443 via the Octavia LB -- a port
      # here would point clients at an address that no longer answers.
{{- if $v.internal }}
      # In-cluster only (OpenWebUI's backend calls it server-side): no hostname,
      # no listener, no cert, no LB hairpin. resourceUrl is what OAuth discovery
      # would advertise -- moot here, but the field is required.
      resourceUrl: "http://vmcp-{{ $n }}.{{ $.Values.namespace }}.svc:{{ $.Values.vmcp.servicePort }}/mcp"
{{- else }}
      {{- /* with a release path: the full public URL, so this vMCP's RFC 9728 document
             says resource = the URL the client dialled (vMCP and proxies share pkg/auth) */}}
      resourceUrl: "https://{{ $v.host }}{{ $path }}/mcp"
{{- end }}

{{- if $.Values.authz.enabled }}
    # Cedar lives INSIDE incomingAuth on VirtualMCPServer (v1beta1), unlike
    # MCPRemoteProxy where it is top-level. Confirmed against the CRD 2026-09-27.
    authzConfigRef:
      name: {{ include "archi.name" (dict "base" (printf "cedar-%s" $authzSet) "ctx" $) }}
{{- end }}

  outgoingAuth:
    source: discovered
    backends:
{{- range $backends }}
      {{ include "archi.name" (dict "base" . "ctx" $) }}:
        type: discovered
{{- end }}
{{- /* Remote group members: outgoing token exchange instead of discovery.
       Shape gate: kubectl explain virtualmcpserver.spec.outgoingAuth.backends */}}
{{- range $e := $.Values.serverEntries }}
{{- if eq ($e.group | default $.Values.group.name) $group }}
      {{ include "archi.name" (dict "base" $e.name "ctx" $) }}:
{{- if $e.exchangeAudience }}
        type: externalAuthConfigRef
        externalAuthConfigRef:
          name: {{ include "archi.name" (dict "base" $e.name "ctx" $) }}-exchange
{{- else }}
        type: discovered
{{- end }}
{{- end }}
{{- end }}
{{- if gt $reps 1 }}
---
# A voluntary eviction or a node drain never takes both replicas (rollouts are not governed by
# this: the operator's Deployment surges one pod before it removes one).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $n }}
  namespace: {{ $.Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
  labels:
{{ include "archi.labels" $ | indent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {archi-crab.cern.ch/vmcp-pod: {{ $n }}}
{{- end }}
{{- end }}
