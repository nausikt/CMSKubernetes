env: staging
nameSuffix: "-staging"
namespace: archi-crab-staging

group:
  name: crab

vmcp:
  name: crab-mcp-gateway
  host: crab-mcp-gateway-staging.cern.ch
  port: 8080                     # vMCP Service port the HTTPRoute targets
  publicPort: 31393              # NodePort: Octavia LB quota is 0, so the
                                 # Gateway is reached via the LanDB aliases.
                                 # Appears in resourceUrl and the CERN callback.

  # enum: anonymous | oidc   ("local" is described but not implemented in 0.47.0)
  incomingAuthType: oidc

  backendDiscovery: discovered

  # BASE names -- the template applies nameSuffix. Required: without it the
  # operator writes its own backends map declaring type: externalAuthConfigRef
  # with the name from each MCPServer's oidcConfigRef, which is a different
  # kind, so the lookup 404s and the vMCP goes Failed.
  backends:
    - crab
    - site-status
    # - htcondor       # deferred: htcondor-idtokens not yet available

  authServer:
    # Inert while incomingAuthType is oidc. Kept so the switch is one enum value
    # if "local" lands upstream.
    issuer: "https://crab-mcp-gateway-staging.cern.ch:31393"
    signingKeySecret: {name: thv-jwt-signing, key: private-key}
    hmacSecret:       {name: thv-hmac,        key: hmac-key}
    tokenLifespans:
      accessTokenLifespan: 1h
      refreshTokenLifespan: 168h
      authCodeLifespan: 10m

cern:
  issuer: "https://auth.cern.ch/auth/realms/cern"
  jwksUri: "https://auth.cern.ch/auth/realms/cern/protocol/openid-connect/certs"
  # Staging's own CERN client. Its name is the audience the backend apps
  # validate, so staging tokens are rejected by prod backends and vice versa.
  clientId: "crab-mcp-gateway-staging"
  clientSecret: {secretName: toolhive-idp-secret, key: client-secret}
  scopes: [openid, profile, email]

authz:
  enabled: false

telemetry:
  enabled: true
  endpoint: otel-collector-staging.archi-crab-staging.svc.cluster.local:4318
  sampleRate: 1.0

gateway:
  baseName: archi-crab
  namespace: archi-crab-gw
  timeout: 3600s

servers:
  - name: site-status
    image: registry.cern.ch/cmscrab/site-status-mcp:preprod-1789131871
    transport: streamable-http
    port: 8000
    mcpPath: /mcp
    writablePaths: [/tmp]
    envPrefix: SITE_STATUS_MCP
    operatorUsernames: "lhsuanch"
    env:
      - {name: SITE_STATUS_MCP_OPENSEARCH__BASE_URL, value: "https://monit-grafana.cern.ch/api/datasources/proxy/9475"}
      - {name: SITE_STATUS_MCP_SERVER__LOGS_ROOT,    value: "/tmp/logs"}
    envFromSecret:
      - {name: SITE_STATUS_MCP_OPENSEARCH__TOKEN, secretName: monit-grafana, key: token}
    resources:
      proxy:   {requests: {cpu: 50m,  memory: 64Mi},  limits: {cpu: 200m, memory: 256Mi}}
      backend: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

  - name: crab
    image: registry.cern.ch/cmscrab/crab-mcp:preprod-1789131706
    transport: streamable-http
    port: 8000
    mcpPath: /mcp
    writablePaths: [/tmp]
    envPrefix: CRAB_MCP
    operatorUsernames: "kphornsi,crabint1,belforte,vchakrav"
    env:
      - {name: CRAB_MCP_CRAB__BASE_URL,   value: "https://cmsweb-testbed.cern.ch/crabserver/preprod"}
      - {name: CRAB_MCP_CRAB__CERT_PATH,  value: "/data/certs/robotcert.pem"}
      - {name: CRAB_MCP_CRAB__KEY_PATH,   value: "/data/certs/robotkey.pem"}
      - {name: CRAB_MCP_CRAB__CA_BUNDLE,  value: "/etc/grid-certs/igtf.pem"}
      - {name: CRAB_MCP_CRAB__VERIFY_TLS, value: "true"}
    secretMounts:
      - {name: crab-robot-cert, mountPath: /data/certs,    defaultMode: 0400}
      - {name: igtf-bundle,     mountPath: /etc/grid-certs, defaultMode: 0444}
    resources:
      proxy:   {requests: {cpu: 50m,  memory: 64Mi},  limits: {cpu: 200m, memory: 256Mi}}
      backend: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

  # DEFERRED: htcondor-idtokens secret not yet available (/data/certs/tokens.d).
  # Re-enable with the secret. Needs egress 9620 to CERN *and* FNAL when
  # NetworkPolicy is turned on, and has no OIDC block of its own (F60).
  # - name: htcondor
  #   image: registry.cern.ch/cmscrab/htcondor-mcp:preprod-1789132354
  #   transport: streamable-http
  #   port: 8003
  #   mcpPath: /mcp
  #   writablePaths: [/tmp]
  #   envPrefix: HTCONDOR_MCP
  #   env:
  #     - {name: HTCONDOR_MCP_CONDOR__POOL,      value: "cmsgwms-collector-global.cern.ch:9620,cmsgwms-collector-global.fnal.gov:9620"}
  #     - {name: HTCONDOR_MCP_CONDOR__TOKEN_DIR, value: "/data/certs/tokens.d"}
  #     - {name: HTCONDOR_MCP_OPENSEARCH__BASE_URL, value: "https://monit-grafana.cern.ch/api/datasources/proxy/8787"}
  #   envFromSecret:
  #     - {name: HTCONDOR_MCP_OPENSEARCH__TOKEN, secretName: monit-grafana, key: token}
  #   secretMounts:
  #     - {name: htcondor-idtokens, mountPath: /data/certs/tokens.d, defaultMode: 0400}
  #   resources:
  #     proxy:   {requests: {cpu: 50m,  memory: 64Mi},  limits: {cpu: 200m, memory: 256Mi}}
  #     backend: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

networkPolicy:
  enabled: false
  egressCIDRs:
    - "137.138.0.0/16"
    - "188.184.0.0/15"
  # From: kubectl -n default get endpoints kubernetes
  apiServerCIDRs:
    - "10.254.0.1/32"
    - "188.184.91.154/32"
  apiServerPort: 6443
