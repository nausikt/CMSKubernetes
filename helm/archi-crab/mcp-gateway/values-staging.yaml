env: staging
nameSuffix: "-staging"
namespace: archi-crab-staging

group:
  name: crab

# Staging's groups (the base list is prod's). sst retired 2026-10-16: the SST team's
# own triage MCP replaces the sst-mcp surface; site-status-staging stays in crab.
groups: [crab, crab-operator, oc-common, okg]

backendAuth:
  # FALSE deliberately. The vMCP cannot authenticate to backends that enforce
  # their own OIDC: its health checks and capability aggregation carry no user
  # token, backends answer 401 "authorization header required", and every
  # session collapses with "no backends returned capabilities".
  #
  # So the vMCP is the ONLY gate, and NetworkPolicy is what keeps anything
  # else in the cluster from reaching the backend proxies directly. That makes
  # the policy load-bearing rather than defence in depth -- it is currently
  # DISABLED and must be re-enabled before this carries users.
  enabled: false

# ---------------------------------------------------------------------------
# vMCPs: ONE PER AUDIENCE, all fronting the same MCPGroup.
#
# oidcConfigRef.audience is a single string and "MUST be unique per server".
# Two client families produce two audiences, and nothing in the chain converts
# one to the other (OpenWebUI forwards verbatim; ToolHive has no incoming-leg
# exchange). So each client family gets its own vMCP: one extra hostname and
# cert, no new CERN app, per-user identity intact. See templates/vmcp.yaml.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# BUNDLE RELEASES (2026-10-17): the okg engine x corpus model for the crab bundle.
#   crab-mcp-staging.cern.ch/mcp                  latest  (bundles.latest)
#   crab-mcp-staging.cern.ch/releases/<v>/mcp     one vMCP per release (`release: <v>`)
# A release = ONE MCPGroup + ONE Cedar set (+ the vMCP's backends list). vMCPs carry
# `release:` and inherit all three, so latest, the release path and OpenWebUI cannot drift.
#   PROMOTE   change `latest` (one line): crab-mcp and crab-mcp-webui follow it.
#   NEW       a new group + Cedar set + releases entry + one `release: <v>` vMCP.
#   FREEZE    pin the group's images by digest, render, copy the vMCP's annotation
#             archi-crab.cern.ch/bundle-fingerprint into `frozen:`. From then on the
#             chart refuses to render if anything the release's callers get changes.
# Shared members (compops, later sst-triage) are external: a freeze covers what WE run.
# ---------------------------------------------------------------------------
bundles:
  latest: v0.2.0-rc1-operator
  releases:
    v0.2.0-rc1-operator:
      # = v0.1.0 + the revamped crab-mcp image (servers: crab-op) + sst-triage. Same Cedar
      # (`default`). site-status is v0.1.0's instance (entry); compops and sst-triage are
      # third parties reached by token exchange: each user sees and calls what THEIR
      # permissions there allow, nothing decided here.
      group: crab-operator
      authzSet: default
      backends: [crab-op]       # the only MCPServer member; the rest are ServerEntries
    v0.1.0:
      # EXACTLY today's bundle: crab + site-status (MCPServers) + compops (ServerEntry,
      # token exchange), Cedar `default`. Benchmark baseline -- frozen, never edited.
      group: crab
      authzSet: default          # today's Cedar set, unchanged (values.yaml authz.sets.default)
      # set by runbook F3 (after F1 pins the images); "" = not yet enforced
      frozen: "fcb21a4c7c00fa2f"

vmcps:
  - name: crab-mcp
    host: crab-mcp-staging.cern.ch
    # The PUBLIC client. Desktop MCP clients (Claude Code, mcp-inspector) do
    # PKCE with a localhost redirect and hold no secret; CERN mints
    # aud=<clientId>. claude mcp add --client-id crab-mcp-gateway-public-staging ...
    audience: crab-mcp-gateway-public-staging
    release: latest
  - name: crab-mcp-v0-2-0-rc1-operator
    host: crab-mcp-staging.cern.ch      # serves /releases/v0.2.0-rc1-operator/mcp
    audience: crab-mcp-gateway-public-staging
    release: v0.2.0-rc1-operator
  - name: crab-mcp-v0-1-0
    host: crab-mcp-staging.cern.ch      # serves /releases/v0.1.0/mcp
    audience: crab-mcp-gateway-public-staging
    release: v0.1.0
  - name: crab-mcp-webui
    # INTERNAL ONLY: no gateway listener / DNS alias. host feeds resourceUrl
    # for OAuth discovery, which OpenWebUI never uses (system_oauth token).
    internal: true        # reached in-cluster by OpenWebUI; no DNS alias, no cert
    # OpenWebUI's CONFIDENTIAL client -- the one users log in through, whose
    # roles (base-user, archi-admins) gate the UI. auth_type: system_oauth
    # forwards that login token as-is, so this vMCP validates its audience.
    audience: archi-crab-staging
    release: v0.1.0      # OpenWebUI stays on v0.1.0 until rc1 fits its 128-tool limit
  # sst-mcp (the site-status team's own surface) retired 2026-10-16.
  # okg for OpenWebUI: internal, validates OpenWebUI's own token audience, so
  # OpenWebUI registers it as a second tool server (id okg) next to crab.
  - name: okg-webui
    internal: true
    audience: archi-crab-staging
    group: okg
    backends: []   # the okg-mcp ServerEntry joins via group match

# Shared by every vMCP above.
vmcp:
  servicePort: 4483              # the port the operator gives vmcp-<name>.
                                 # NOT spec.port. Verify: kubectl get svc | grep vmcp
  # BASE names -- the template applies nameSuffix. Required: without it the
  # operator writes its own backends map declaring type: externalAuthConfigRef
  # with the name from each MCPServer's oidcConfigRef, which is a different
  # kind, so the lookup 404s and the vMCP goes Failed.
  backends:
    - crab
    - site-status
    # - htcondor       # deferred: htcondor-idtokens not yet available

cern:
  issuer:  "https://auth.cern.ch/auth/realms/cern"
  jwksUri: "https://auth.cern.ch/auth/realms/cern/protocol/openid-connect/certs"
  # The audience the BACKENDS validate (<PREFIX>_OIDC__AUDIENCE) when they
  # check tokens themselves. With two vMCPs a backend may receive either
  # audience, which is why site-status and crab below have
  # disableBearerAuth: true -- the vMCP is the only gate until
  # MCPExternalAuthConfig gives each backend its own exchanged audience.
  clientId: "crab-mcp-gateway-public-staging"
  scopes: [openid, profile, email]

telemetry:
  enabled: true
  endpoint: otel-collector-staging.archi-crab-staging.svc.cluster.local:4318
  sampleRate: 1.0

gateway:
  baseName: archi-crab
  namespace: archi-crab-gw
  timeout: 3600s

servers:
  - name: site-status
    image: registry.cern.ch/cmscrab/site-status-mcp@sha256:8c8b29a8bf40ba92b60ed7ec53985d4df0b12fd53bf0ffa93309a00a353aac2f  # was :preprod-1789131871
    transport: streamable-http
    port: 8000
    mcpPath: /mcp
    writablePaths: [/tmp]
    envPrefix: SITE_STATUS_MCP
    operatorUsernames: "lhsuanch"
    # With two vMCPs this backend receives tokens carrying EITHER audience,
    # and its verifier checks one. Consistent with crab below and with
    # backendAuth.enabled: false -- the vMCP is the only gate. Revert together
    # with crab when MCPExternalAuthConfig gives each backend its own audience.
    disableBearerAuth: true
    env:
      - {name: SITE_STATUS_MCP_OPENSEARCH__BASE_URL, value: "https://monit-grafana.cern.ch/api/datasources/proxy/9475"}
      - {name: SITE_STATUS_MCP_SERVER__LOGS_ROOT,    value: "/tmp/logs"}
    envFromSecret:
      - {name: SITE_STATUS_MCP_OPENSEARCH__TOKEN, secretName: monit-grafana, key: token}
    resources:
      proxy:   {requests: {cpu: 50m,  memory: 64Mi},  limits: {cpu: 200m, memory: 256Mi}}
      backend: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

  - name: crab
    image: registry.cern.ch/cmscrab/crab-mcp@sha256:5e7c0e0de1d0847cc4bae2b3112b53214baeffe470ff095c708cd1fda0ad94fb  # was :preprod-1789131706
    transport: streamable-http
    port: 8000
    mcpPath: /mcp
    writablePaths: [/tmp]
    envPrefix: CRAB_MCP
    # ⚠ "demo" is here ONLY because disableBearerAuth is true in staging --
    # every caller resolves to demo, so this grants operator-tier tools to
    # anyone who reaches the gateway. Remove it with the disable flag when
    # tokenExchange lands.
    operatorUsernames: "kphornsi,crabint1,belforte,vchakrav,demo"
    # ⚠ TEMPORARY, STAGING ONLY. The vMCP in operator 0.47.0 cannot forward the
    # user's token, so crab-mcp rejects every call. This turns off its bearer
    # check -- and with it every per-user control: owner checks pass for
    # everyone, operator-tier tools open to all, cmsweb sees only the robot.
    # REMOVE when tokenExchange lands (crab-mcp's verifier already supports it;
    # only CRAB_MCP_OIDC__AUDIENCE changes). Tracked as <ticket>.
    disableBearerAuth: true
    env:
      # STAGING hits the CRAB TESTBED. Pointing staging at production CRAB with
      # disableBearerAuth: true is unauthenticated reads of production task data
      # via the robot cert -- this regressed once already (F59).
      - {name: CRAB_MCP_CRAB__BASE_URL,   value: "https://cmsweb.cern.ch/crabserver/prod"}
      - {name: CRAB_MCP_CRAB__CERT_PATH,  value: "/data/certs/robotcert.pem"}
      - {name: CRAB_MCP_CRAB__KEY_PATH,   value: "/data/certs/robotkey.pem"}
      - {name: CRAB_MCP_CRAB__CA_BUNDLE,  value: "/etc/grid-certs/igtf.pem"}
      - {name: CRAB_MCP_CRAB__VERIFY_TLS, value: "true"}
    secretMounts:
      - {name: crab-robot-cert, mountPath: /data/certs,    defaultMode: 0400}
      - {name: igtf-bundle,     mountPath: /etc/grid-certs, defaultMode: 0444}
    resources:
      proxy:   {requests: {cpu: 50m,  memory: 64Mi},  limits: {cpu: 200m, memory: 256Mi}}
      backend: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

  # crab-mcp for release v0.2.0-rc1-operator ONLY (group crab-operator): `crab` above with
  # its own image. Starts on v0.1.0's digest; BUMP = change the digest on the marked line.
  # Name crab-op != crab: workload names are unique, so rc1's tools are crab-op-staging_*.
  - name: crab-op
    group: crab-operator
    image: registry.cern.ch/cmscrab/crab-mcp@sha256:0c98d8bebc1caa7fdcc236d60c547d61014e847d15b93fb9b8f67cebb1be3ef1   # <- rc1 crab-mcp image (bump here) :v1.261017.patch3
    transport: streamable-http
    port: 8000
    mcpPath: /mcp
    writablePaths: [/tmp]
    envPrefix: CRAB_MCP
    operatorUsernames: "kphornsi,crabint1,belforte,vchakrav,demo"   # same as crab (same caveat)
    disableBearerAuth: true                                         # same as crab (same caveat)
    env:
      - {name: CRAB_MCP_CRAB__BASE_URL,   value: "https://cmsweb.cern.ch/crabserver/prod"}
      - {name: CRAB_MCP_CRAB__CERT_PATH,  value: "/data/certs/robotcert.pem"}
      - {name: CRAB_MCP_CRAB__KEY_PATH,   value: "/data/certs/robotkey.pem"}
      - {name: CRAB_MCP_CRAB__CA_BUNDLE,  value: "/etc/grid-certs/igtf.pem"}
      - {name: CRAB_MCP_CRAB__VERIFY_TLS, value: "true"}
    secretMounts:
      - {name: crab-robot-cert, mountPath: /data/certs,    defaultMode: 0400}
      - {name: igtf-bundle,     mountPath: /etc/grid-certs, defaultMode: 0444}
    resources:
      proxy:   {requests: {cpu: 50m,  memory: 64Mi},  limits: {cpu: 200m, memory: 256Mi}}
      backend: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

  # DEFERRED: htcondor-idtokens secret not yet available (/data/certs/tokens.d).
  # Re-enable with the secret. Needs egress 9620 to CERN *and* FNAL when
  # NetworkPolicy is turned on, and has no OIDC block of its own (F60).
  # - name: htcondor
  #   image: registry.cern.ch/cmscrab/htcondor-mcp:preprod-1789132354
  #   transport: streamable-http
  #   port: 8003
  #   mcpPath: /mcp
  #   writablePaths: [/tmp]
  #   envPrefix: HTCONDOR_MCP
  #   env:
  #     - {name: HTCONDOR_MCP_CONDOR__POOL,      value: "cmsgwms-collector-global.cern.ch:9620,cmsgwms-collector-global.fnal.gov:9620"}
  #     - {name: HTCONDOR_MCP_CONDOR__TOKEN_DIR, value: "/data/certs/tokens.d"}
  #     - {name: HTCONDOR_MCP_OPENSEARCH__BASE_URL, value: "https://monit-grafana.cern.ch/api/datasources/proxy/8787"}
  #   envFromSecret:
  #     - {name: HTCONDOR_MCP_OPENSEARCH__TOKEN, secretName: monit-grafana, key: token}
  #   secretMounts:
  #     - {name: htcondor-idtokens, mountPath: /data/certs/tokens.d, defaultMode: 0400}
  #   resources:
  #     proxy:   {requests: {cpu: 50m,  memory: 64Mi},  limits: {cpu: 200m, memory: 256Mi}}
  #     backend: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

networkPolicy:
  enabled: false
  egressCIDRs:
    - "137.138.0.0/16"
    - "188.184.0.0/15"
  # From: kubectl -n default get endpoints kubernetes
  apiServerCIDRs:
    - "10.254.0.1/32"
    - "188.184.91.154/32"
  apiServerPort: 6443

# Cedar ON in staging first (shadow week), prod follows.
authz:
  enabled: true

# compops: colleague's vMCP (aud=mcp-gateway-test) as a MEMBER of the crab
# group -- its tools appear in BOTH crab vMCPs (Claude Code and OpenWebUI)
# behind the single crab-mcp-gateway endpoint. No pods, no extra DNS, no extra
# OpenWebUI registration.
# NOTE the exchange subject differs per vMCP: via crab-mcp-webui the subject
# token has aud=archi-crab-staging (grant proven); via crab-mcp-gateway it has
# aud=crab-mcp-gateway-public-staging -- if that path 401s on exchange, ask
# the SSO team to extend the exchange permission to that audience too.
serverEntries:
  # okg: SEPARATE from the crab bundle -- its own group, fronted for OpenWebUI
  # by the internal okg-webui vMCP (Claude Code uses the standalone
  # archi-crab-okg-staging.cern.ch proxy). Named okg-mcp, NOT okg: the
  # MCPRemoteProxy is already okg-staging and the vMCP's discovery resolved
  # the colliding name to the proxy and dropped the entry (2026-09-28).
  - name: okg-mcp
    url: http://archi-crab-okg-staging-mcp.archi-crab-staging.svc:8765/mcp
    group: okg
    private: true
  - name: compops
    url: https://vmcp-mcp-gateway.app.cern.ch/mcp
    group: crab
    exchangeAudience: mcp-gateway-test
    clientId: archi-crab-staging
    secretName: openwebui-idp-secret

  # --- group crab-operator = release v0.2.0-rc1-operator (crab-op is a server above).
  # Entry names differ from v0.1.0's workloads (names are unique; discovery drops a
  # collision, okg-mcp 2026-09-28), so rc1's tools are site-status-op-staging_*,
  # compops-op-staging_*, sst-triage-staging_*.
  - name: site-status-op            # v0.1.0's site-status instance, shared
    url: http://mcp-site-status-staging-proxy.archi-crab-staging.svc.cluster.local:8000/mcp
    group: crab-operator
    private: true
  - name: compops-op                # same third party, same exchange as compops
    url: https://vmcp-mcp-gateway.app.cern.ch/mcp
    group: crab-operator
    exchangeAudience: mcp-gateway-test
    clientId: archi-crab-staging
    secretName: openwebui-idp-secret
  # sst-triage: the SST team's operator-grade MCP -- NOT a replacement for site-status.
  # Wired exactly like compops: the caller's token is exchanged (RFC 8693) for
  # aud=cms-sst-triage-mcp-cli by crab-mcp-gateway-staging, the requester SST granted.
  # SST sees the real user (cern_upn, its own roles) and alone decides which tools that
  # user gets and may call; ToolHive v0.47.0 aggregates per user, so someone SST does not
  # admit simply has no sst-triage tools. Secret crab-mcp-gateway-idp: runbook step 3.
  - name: sst-triage
    url: https://cms-sst-triage-mcp.app.cern.ch/mcp
    group: crab-operator
    exchangeAudience: cms-sst-triage-mcp-cli
    clientId: crab-mcp-gateway-staging
    secretName: toolhive-idp-secret

# --- archi-crab-okg as its own MCP endpoint -----------------------------------
# Manual prereqs, once: CERN public app archi-crab-okg-public-staging (PKCE,
# redirect http://localhost:8765/callback, role cms-members), host cert Secret
# archi-crab-okg-staging-tls in archi-crab-gw, alias archi-crab-okg-staging on
# the Octavia LB's landb-alias tag. The okg instance is deployed by the Argo app
# archi-crab-okg-staging (argocd/archi-crab/staging/45-okg-app.yaml).
# RELEASES (archi-crab-okg releases/matrix.yaml, docs/RELEASES.md). One proxy per released
# instance at /releases/<engine>/<corpus> (okg) or /<family>/releases/<corpus> (v2). The
# path-less `okg` and the /grep, /vectorstore entries are POINTERS to the latest instance: thin
# proxies of their own (the OAuth resource URL must equal the dialled URL), never a second
# instance. Moving "latest" = changing a pointer's `url:`.
remoteProxies:
  # POINTER: staging "latest" (/mcp) -> A (43f459c6 x v0.1.0) today, D (v0.2.0-rc1 x v0.2.0-rc1) later.
  - name: okg
    url: http://archi-crab-okg-staging-mcp.archi-crab-staging.svc:8765/mcp
    private: true
    host: archi-crab-okg-staging.cern.ch
    audience: archi-crab-okg-public-staging
    policies: &okg-policies
      - |
        permit(principal, action == Action::"list_tools", resource);
      - |
        // raw SQL never reaches agents, whoever they are
        forbid(principal, action == Action::"call_tool", resource == Tool::"query");
      - |
        permit(principal, action == Action::"call_tool", resource)
        when { principal has claim_cern_roles
               && principal.claim_cern_roles.contains("cms-members") };

  # run1 (okg v3, /run1) retired 2026-10-16 with its app and volumes (archi-crab-okg RELEASES 0.4).
  # A: okg engine 43f459c6 x corpus v0.1.0 (the instance staging built on 2026-10-06)
  - name: okg-43f459c6-v0-1-0
    enabled: true
    url: http://archi-crab-okg-staging-mcp.archi-crab-staging.svc:8765/mcp
    private: true
    host: archi-crab-okg-staging.cern.ch
    path: /releases/43f459c6/v0.1.0
    audience: archi-crab-okg-public-staging
    policies: *okg-policies
  # C: okg engine v0.2.0-rc1 (06a4771) x corpus v0.1.0
  - name: okg-v0-2-0-rc1-v0-1-0
    enabled: true
    url: http://archi-crab-okg-v0-2-0-rc1-v0-1-0-mcp.archi-crab-staging.svc:8765/mcp
    private: true
    host: archi-crab-okg-staging.cern.ch
    path: /releases/v0.2.0-rc1/v0.1.0
    audience: archi-crab-okg-public-staging
    policies: *okg-policies
  # dev slot: okg `dev`, re-pinned weekly (engine dev-<week>) x the newest corpus. STAGING ONLY.
  # Fixed Service and path; the instance behind them is rebuilt every week (RELEASES "Weekly dev slot").
  - name: okg-dev
    enabled: true
    url: http://archi-crab-okg-dev-mcp.archi-crab-staging.svc:8765/mcp
    private: true
    host: archi-crab-okg-staging.cern.ch
    path: /releases/dev
    audience: archi-crab-okg-public-staging
    policies: *okg-policies

  # --- archi v2 benchmark fixture (archi-crab-okg v2/, release archi-v2, one environment).
  # ONE hostname archi-crab-v2.cern.ch, a path per tool family; the MCP servers are sidecars of
  # the archi-v2 data-manager pod. Same public app as okg: one login covers v2 and v3 for the
  # benchmark harness. Enabled 2026-10-05 (V2-BENCH phase 4): archi-v2 runs with mcp.auth none,
  # so these proxies are the only gate; its NetworkPolicy admits only toolhive: "true" pods.
  # POINTERS: v2 "latest" (/grep/mcp, /vectorstore/mcp) -> corpus v0.1.0 today, v0.2.0-rc1 later.
  - name: v2-grep
    enabled: true
    url: http://archi-v2-mcp-grep.archi-crab-staging.svc:8081/mcp
    private: true
    host: archi-crab-v2.cern.ch
    path: /grep
    audience: archi-crab-okg-public-staging
    policies: &v2-policies
      - |
        permit(principal, action == Action::"list_tools", resource);
      - |
        permit(principal, action == Action::"call_tool", resource)
        when { principal has claim_cern_roles
               && principal.claim_cern_roles.contains("cms-members") };
  - name: v2-vector
    enabled: true
    url: http://archi-v2-mcp-vector.archi-crab-staging.svc:8082/mcp
    private: true
    host: archi-crab-v2.cern.ch
    path: /vectorstore
    audience: archi-crab-okg-public-staging
    policies: *v2-policies
  # v2 x corpus v0.1.0 (release archi-v2, built 2026-10-05)
  - name: v2-grep-v0-1-0
    enabled: true
    url: http://archi-v2-mcp-grep.archi-crab-staging.svc:8081/mcp
    private: true
    host: archi-crab-v2.cern.ch
    path: /grep/releases/v0.1.0
    audience: archi-crab-okg-public-staging
    policies: *v2-policies
  - name: v2-vector-v0-1-0
    enabled: true
    url: http://archi-v2-mcp-vector.archi-crab-staging.svc:8082/mcp
    private: true
    host: archi-crab-v2.cern.ch
    path: /vectorstore/releases/v0.1.0
    audience: archi-crab-okg-public-staging
    policies: *v2-policies
