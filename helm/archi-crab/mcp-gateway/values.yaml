# =============================================================================
# crab-mcp-gateway  --  ONE RELEASE PER ENVIRONMENT
#
# ARCHITECTURE: three backend MCPServers in an MCPGroup, fronted by ONE
# VirtualMCPServer. Clients see one hostname and one aggregated tool list.
#
#   client --ToolHive JWT--> vMCP --upstreamInject--> backend (CERN token)
#                             |  embedded auth server: ONE login at CERN SSO
#                             |  Cedar: ONE policy over the whole tool surface
#
# WHY: per-MCPServer hostnames cost 2 hostnames + 2 certs + 2 redirect URIs per
# server per environment. vMCP makes that flat: 5 hostnames forever.
#
# WHAT IT COSTS: per-server audience isolation. One vMCP = one issued-JWT
# audience, so a client token works across every backend in the group.
# THE TRUST BOUNDARY IS THE GROUP -- another team's MCP must NOT join it.
# =============================================================================

env: prod
nameSuffix: ""
namespace: archi-crab
obsNamespace: archi-crab-obs

# VERIFY against your operator build before syncing:
#   kubectl api-resources --api-group=toolhive.stacklok.dev -o wide
apiVersions:
  mcpServer: toolhive.stacklok.dev/v1beta1
  mcpGroup: toolhive.stacklok.dev/v1beta1
  virtualMCPServer: toolhive.stacklok.dev/v1beta1
  mcpOIDCConfig: toolhive.stacklok.dev/v1beta1
  mcpTelemetryConfig: toolhive.stacklok.dev/v1beta1

group:
  name: crab

backendAuth:
  # FALSE deliberately. The vMCP cannot authenticate to backends that enforce
  # their own OIDC: its health checks and capability aggregation carry no user
  # token, backends answer 401 "authorization header required", and every
  # session collapses with "no backends returned capabilities".
  #
  # So the vMCP is the ONLY gate, and NetworkPolicy is what keeps anything
  # else in the cluster from reaching the backend proxies directly. That makes
  # the policy load-bearing rather than defence in depth -- it is currently
  # DISABLED and must be re-enabled before this carries users.
  enabled: false

# ---------------------------------------------------------------------------
# vMCPs: ONE PER AUDIENCE, all fronting the same MCPGroup.
#
# oidcConfigRef.audience is a single string and "MUST be unique per server".
# Two client families produce two audiences, and nothing in the chain converts
# one to the other (OpenWebUI forwards verbatim; ToolHive has no incoming-leg
# exchange). So each client family gets its own vMCP: one extra hostname and
# cert, no new CERN app, per-user identity intact. See templates/vmcp.yaml.
# ---------------------------------------------------------------------------
vmcps:
  - name: crab-mcp-gateway
    host: crab-mcp-gateway.cern.ch
    # The PUBLIC client. Desktop MCP clients (Claude Code, mcp-inspector) do
    # PKCE with a localhost redirect and hold no secret; CERN mints
    # aud=<clientId>. claude mcp add --client-id crab-mcp-gateway-public ...
    audience: crab-mcp-gateway-public
  - name: crab-mcp-webui
    host: crab-mcp-webui.cern.ch
    # OpenWebUI's CONFIDENTIAL client -- the one users log in through, whose
    # roles (base-user, archi-admins) gate the UI. auth_type: system_oauth
    # forwards that login token as-is, so this vMCP validates its audience.
    audience: archi-crab-production

# Shared by every vMCP above.
vmcp:
  servicePort: 4483              # the port the operator gives vmcp-<name>.
                                 # NOT spec.port. Verify: kubectl get svc | grep vmcp
  publicPort: 31393              # NodePort: Octavia LB quota is 0, so the
                                 # Gateway is reached via the LanDB aliases.
                                 # Appears in resourceUrl and every CERN callback.
  # BASE names -- the template applies nameSuffix. Required: without it the
  # operator writes its own backends map declaring type: externalAuthConfigRef
  # with the name from each MCPServer's oidcConfigRef, which is a different
  # kind, so the lookup 404s and the vMCP goes Failed.
  backends:
    - crab
    - site-status
    # - htcondor       # deferred: htcondor-idtokens not yet available

cern:
  issuer:  "https://auth.cern.ch/auth/realms/cern"
  jwksUri: "https://auth.cern.ch/auth/realms/cern/protocol/openid-connect/certs"
  # The audience the BACKENDS validate (<PREFIX>_OIDC__AUDIENCE) when they
  # check tokens themselves. With two vMCPs a backend may receive either
  # audience, which is why site-status and crab below have
  # disableBearerAuth: true -- the vMCP is the only gate until
  # MCPExternalAuthConfig gives each backend its own exchanged audience.
  clientId: "crab-mcp-gateway-public"
  scopes: [openid, profile, email]

# ---------------------------------------------------------------------------
# Cedar. ONE policy over the aggregated tool surface -- the vMCP dividend.
#
# ROLLOUT: shadow the apps' OPERATOR_USERNAMES first, watch for divergence for
# a week, only then empty those env vars. Cedar denies BEFORE the backend is
# reached, so a policy bug looks like a broken tool, not a denied one.
# ---------------------------------------------------------------------------
authz:
  enabled: false                    # enable only after the claims check
  policies: |
    permit(principal, action == Action::"list_tools", resource);

    permit(principal, action == Action::"call_tool", resource)
    when { resource in [Tool::"get_task_status", Tool::"check_crab_user"] };

    // mirrors CRAB_MCP_SERVER__OPERATOR_USERNAMES exactly, for the shadow period
    permit(principal, action == Action::"call_tool", resource)
    when {
      resource in [Tool::"count_tasks_by_status", Tool::"tasks_by_status",
                   Tool::"tasks_by_ddmreqid", Tool::"last_failures",
                   Tool::"last_refused"] &&
      principal.claim_cern_upn in ["kphornsi","crabint1","belforte","vchakrav"]
    };

redis:
  enabled: true
  image: redis:7-alpine
  authSecret: redis-thv-auth        # holds the key to every user's CERN tokens

telemetry:
  enabled: true
  endpoint: otel-collector.archi-crab.svc.cluster.local:4318
  sampleRate: 1.0                   # default 0.05 is useless on a testbed

# ---------------------------------------------------------------------------
# Backends. NO host, NO route, NO public surface -- they are reached only
# through the vMCP. Adding one costs nothing outside this list.
# ---------------------------------------------------------------------------
servers:
  - name: site-status
    image: registry.cern.ch/cmscrab/site-status-mcp@sha256:TODO
    transport: streamable-http
    port: 8000
    mcpPath: /mcp
    writablePaths: [/tmp]
    envPrefix: SITE_STATUS_MCP
    operatorUsernames: "lhsuanch"
    env:
      - {name: SITE_STATUS_MCP_OPENSEARCH__BASE_URL, value: "https://monit-grafana.cern.ch/api/datasources/proxy/9475"}
      - {name: SITE_STATUS_MCP_SERVER__LOGS_ROOT,    value: "/tmp/logs"}
    envFromSecret:
      - {name: SITE_STATUS_MCP_OPENSEARCH__TOKEN, secretName: monit-grafana, key: token}
    resources:
      proxy:   {requests: {cpu: 50m,  memory: 64Mi},  limits: {cpu: 200m, memory: 256Mi}}
      backend: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

  - name: crab
    image: registry.cern.ch/cmscrab/crab-mcp:preprod-1789131706
    transport: streamable-http
    port: 8000
    mcpPath: /mcp
    writablePaths: [/tmp]
    envPrefix: CRAB_MCP
    operatorUsernames: "kphornsi,crabint1,belforte,vchakrav"
    env:
      - {name: CRAB_MCP_CRAB__BASE_URL,   value: "https://cmsweb.cern.ch/crabserver/prod"}
      - {name: CRAB_MCP_CRAB__CERT_PATH,  value: "/data/certs/robotcert.pem"}
      - {name: CRAB_MCP_CRAB__KEY_PATH,   value: "/data/certs/robotkey.pem"}
      - {name: CRAB_MCP_CRAB__CA_BUNDLE,  value: "/etc/grid-certs/igtf.pem"}
      - {name: CRAB_MCP_CRAB__VERIFY_TLS, value: "true"}
    secretMounts:
      - {name: crab-robot-cert, mountPath: /data/certs,    defaultMode: 0400}
      - {name: igtf-bundle,     mountPath: /etc/grid-certs, defaultMode: 0444}
    resources:
      proxy:   {requests: {cpu: 50m,  memory: 64Mi},  limits: {cpu: 200m, memory: 256Mi}}
      backend: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

  # DEFERRED: htcondor-idtokens secret not yet available (/data/certs/tokens.d).
  # Re-enable with the secret. Needs egress 9620 to CERN *and* FNAL when
  # NetworkPolicy is turned on, and has no OIDC block of its own (F60).
  # - name: htcondor
  #   image: registry.cern.ch/cmscrab/htcondor-mcp:preprod-1789132354
  #   transport: streamable-http
  #   port: 8003                      # NOT 8000
  #   mcpPath: /mcp
  #   writablePaths: [/tmp]
  #   envPrefix: HTCONDOR_MCP
  #   # No OIDC block in its .env.example -- confirm whether it validates tokens
  #   # at all. If not, the vMCP is its only gate and it has no per-user layer.
  #   env:
  #     - {name: HTCONDOR_MCP_CONDOR__POOL,      value: "cmsgwms-collector-global.cern.ch:9620,cmsgwms-collector-global.fnal.gov:9620"}
  #     - {name: HTCONDOR_MCP_CONDOR__TOKEN_DIR, value: "/data/certs/tokens.d"}
  #     - {name: HTCONDOR_MCP_OPENSEARCH__BASE_URL, value: "https://monit-grafana.cern.ch/api/datasources/proxy/8787"}
  #   envFromSecret:
  #     - {name: HTCONDOR_MCP_OPENSEARCH__TOKEN, secretName: monit-grafana, key: token}
  #   secretMounts:
  #     - {name: htcondor-idtokens, mountPath: /data/certs/tokens.d, defaultMode: 0400}
  #   resources:
  #     proxy:   {requests: {cpu: 50m,  memory: 64Mi},  limits: {cpu: 200m, memory: 256Mi}}
  #     backend: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}

gateway:
  baseName: archi-crab
  namespace: archi-crab-gw
  timeout: 3600s

networkPolicy:
  enabled: false
  # A compromised or injected backend holds a live user token. Where it can SEND
  # that token is the control that matters. htcondor also needs 9620 to CERN
  # AND FNAL -- the allowlist cannot be CERN-only.
  egressCIDRs:
    - "137.138.0.0/16"
    - "188.184.0.0/15"
  # From: kubectl -n default get endpoints kubernetes
  apiServerCIDRs:
    - "10.254.0.1/32"
    - "188.184.91.154/32"
  apiServerPort: 6443
  
