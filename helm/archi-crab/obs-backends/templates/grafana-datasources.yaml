{{- if .Values.grafana.enabled }}
# Datasources, provisioned as config rather than clicked in. Both are queried
# with an env filter, which is why deployment.environment must be present on
# every signal (F13).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/part-of: archi-crab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.{{ .Values.namespace }}.svc.cluster.local
        isDefault: true
{{- if .Values.langfuse.enabled }}
      # Langfuse is the trace store. It is NOT a Grafana-native datasource:
      # traces are read in the Langfuse UI. This entry exists so dashboards can
      # deep-link by trace id rather than making people hunt.
      - name: Langfuse
        type: grafana-simple-json-datasource
        access: proxy
        url: http://langfuse-web.{{ .Values.namespace }}.svc.cluster.local:3000
        jsonData: {tlsSkipVerify: true}
{{- end }}
{{- end }}
