apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: archi-crab
    # No env label: this namespace is shared and must not match either
    # Gateway's allowedRoutes selector.
    archi-crab.cern.ch/scope: shared
    pod-security.kubernetes.io/enforce: baseline
