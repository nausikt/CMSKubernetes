{{- if and .Values.enabled .Values.bootstrap.enabled }}
{{- $n := include "archi.name" (dict "base" "openwebui" "ctx" $) }}
{{- $svc := printf "http://%s.%s.svc.cluster.local:8080" $n .Values.namespace }}
{{- /*
Both Jobs are PostSync, ordered by hook-weight. They MUST run after the
Deployment: an earlier revision made bootstrap-admin a PreSync hook, which
deadlocks on a fresh install -- the hook polls an OpenWebUI that the sync it
is blocking has not yet created. Prod hit exactly that for 73 minutes.

BeforeHookCreation re-runs both on every sync, which is the reconciliation
property we want: desired state in Git, converged on every sync, no UI click.
Both scripts are idempotent, so re-running is free.

NOTE the tools Job registers into OpenWebUI's DATABASE. The running pod loads
tool servers once at startup, so after the FIRST registration on a fresh PVC
one `kubectl rollout restart deploy/<openwebui>` is needed. After that, the
PVC keeps the registration and every later startup sees it.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}-bootstrap
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-weight: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
{{ (.Files.Glob "scripts/*.py").AsConfig | indent 2 }}
{{- range $job := list
      (dict "name" "admin" "weight" "0" "script" "create-admin.py"
            "doc"  "Creates OpenWebUI's FIRST account, which becomes admin. Signup closes once any account exists (403), so the script checks signin first.")
      (dict "name" "tools" "weight" "1" "script" "register-tools.py"
            "doc"  "Reconciles TOOL_SERVER_CONNECTIONS via POST /api/v1/configs/tool_servers -- the whole list, replace-style; there is no PATCH.")
}}
---
# {{ $job.doc }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $n }}-bootstrap-{{ $job.name }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-weight: {{ $job.weight | quote }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
{{ include "archi.labels" $ | indent 4 }}
spec:
  backoffLimit: 3
  # Failed pods are kept (Never, not OnFailure) so the error is readable;
  # BeforeHookCreation cleans them up on the next sync.
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
{{ include "archi.podSecurityContext" $ | indent 8 }}
      containers:
        - name: bootstrap-{{ $job.name }}
          image: python:3.12-alpine
          securityContext:
{{ include "archi.containerSecurityContext" $ | indent 12 }}
          env:
            - {name: WEBUI_BASE_URL, value: {{ $svc | quote }}}
            - name: ADMIN_EMAIL
              valueFrom: {secretKeyRef: {name: openwebui-admin, key: email}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: openwebui-admin, key: password}}
{{- if eq $job.name "tools" }}
            - {name: TOOL_SERVERS_JSON, value: {{ $.Values.toolServers | toJson | quote }}}
{{- end }}
          command: ["python3", "/scripts/{{ $job.script }}"]
          volumeMounts: [{name: scripts, mountPath: /scripts, readOnly: true}]
      volumes:
        - name: scripts
          configMap: {name: {{ $n }}-bootstrap, defaultMode: 0555}
{{- end }}
{{- end }}
