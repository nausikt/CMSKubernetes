{{- if .Values.enabled }}
{{- $n := include "archi.name" (dict "base" "openwebui" "ctx" $) }}
{{- $llm := include "archi.name" (dict "base" .Values.litellm.baseName "ctx" $) }}
# SKELETON. Enough to route to and to prove the auth path; the rest is yours.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  labels:
{{ include "archi.labels" . | indent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ $n }}}}
  template:
    metadata:
      labels:
        app: {{ $n }}
{{ include "archi.labels" . | indent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
{{ include "archi.podSecurityContext" . | indent 8 }}
      containers:
        - name: openwebui
          securityContext:
{{ include "archi.containerSecurityContext" . | indent 12 }}
          image: {{ .Values.image }}
          env:
            # Models go through THIS environment's LiteLLM, never a provider.
            - {name: OPENAI_API_BASE_URL, value: "http://{{ $llm }}.{{ .Values.namespace }}.svc.cluster.local:4000/v1"}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.litellm.secretName }}, key: OPENWEBUI_VIRTUAL_KEY}
            - {name: OAUTH_PROVIDER_NAME, value: "CERN"}
            - {name: OPENID_PROVIDER_URL, value: "{{ .Values.oidc.issuer }}/.well-known/openid-configuration"}
            - {name: OAUTH_CLIENT_ID, value: {{ .Values.oidc.clientId | quote }}}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.oidc.secretName }}, key: client-secret}
            - {name: ENABLE_OAUTH_ROLE_MANAGEMENT, value: "true"}
            - {name: OAUTH_ROLES_CLAIM,   value: "cern_roles"}
            - {name: OAUTH_ALLOWED_ROLES, value: "base-user,crab-admin"}
            - {name: OAUTH_ADMIN_ROLES,   value: "crab-admin"}
            - {name: WEBUI_URL, value: {{ .Values.publicUrl | quote }}}
            # Supplied, not generated. OpenWebUI writes one to .webui_secret_key
            # at startup, which fails on a read-only rootfs -- and would mint a
            # new key on every restart, invalidating every session.
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: openwebui-secret, key: WEBUI_SECRET_KEY}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment={{ .Values.env }}"}
          ports: [{containerPort: 8080}]
          volumeMounts:
            # readOnlyRootFilesystem: true, and OpenWebUI writes its SQLite DB,
            # uploads and .webui_secret_key here.
            - {name: data, mountPath: /app/backend/data}
            # Python's tempfile needs a writable /tmp -- torch/dill import
            # fails at startup without it.
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits:   {cpu: 1, memory: 2Gi}
      volumes:
        # emptyDir: chat history and settings vanish on every restart. Fine for
        # proving login works; switch to a PVC (cinder) before anyone relies on
        # it. WEBUI_SECRET_KEY comes from a Secret so sessions survive restarts
        # regardless.
        - {name: data, emptyDir: {}}
        - {name: tmp,  emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  labels:
{{ include "archi.labels" . | indent 4 }}
spec:
  selector: {app: {{ $n }}}
  ports: [{port: 8080, targetPort: 8080}]
{{- end }}
