{{- if .Values.enabled }}
{{- $n := include "archi.name" (dict "base" "openwebui" "ctx" $) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $n }}
  namespace: {{ .Values.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
  labels:
{{ include "archi.labels" . | indent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.baseName }}   {{/* shared: NOT suffixed */}}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - backendRefs:
        - name: {{ $n }}
          port: 8080
      timeouts:
        backendRequest: {{ .Values.gateway.timeout }}
        request: {{ .Values.gateway.timeout }}
{{- end }}
