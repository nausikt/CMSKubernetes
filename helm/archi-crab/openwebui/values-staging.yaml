env: staging
nameSuffix: "-staging"
namespace: archi-crab-staging

host: archi-crab-staging.cern.ch

gateway:
  baseName: archi-crab
  namespace: archi-crab-gw
  timeout: 3600s

# Only what differs from values.yaml -- Helm deep-merges the rest, so issuer
# and secretName are inherited. Callback to register:
#   https://archi-crab-staging.cern.ch/oauth/oidc/callback
oidc:
  clientId: archi-crab-staging


persistence:
  enabled: true
  size: 10Gi
  storageClass: cinder-standard

bootstrap:
  enabled: true

toolServers:
  # The vMCP whose audience is THIS OpenWebUI's own CERN client (archi-crab-staging).
  # auth_type: system_oauth forwards the user's login token verbatim, so it must
  # hit the vMCP that validates that audience -- NOT crab-mcp-gateway[-staging],
  # which validates the public client's. Both vMCPs front the same backends.
  #
  # Field shape is ToolServerConnection (routers/configs.py). key and config
  # have no default and must be PRESENT; config MUST be {} not null, or
  # OpenWebUI crashes at startup on `'access_control' in None`.
  - url: "https://crab-mcp-webui-staging.cern.ch"
    path: "/mcp"
    type: "mcp"
    auth_type: "system_oauth"
    key: null
    config: {}
    info:
      id: crab-mcp-gateway
      enabled: true
