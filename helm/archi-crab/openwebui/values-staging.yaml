env: staging
nameSuffix: "-staging"
namespace: archi-crab-staging

# ⚠ NodePort until Octavia quota lands.
host: archi-crab-staging.cern.ch

gateway:
  baseName: archi-crab
  namespace: archi-crab-gw
  timeout: 3600s

# Only what differs from values.yaml -- Helm deep-merges the rest, so issuer
# and secretName are inherited. Callback to register:
#   https://archi-crab-staging.cern.ch:31393/oauth/oidc/callback
oidc:
  clientId: archi-crab-staging
  # The SAME client the vMCP validates. OpenWebUI forwards this token verbatim
  # (auth_type: system_oauth -- it never performs RFC 8693, verified in
  # routers/configs.py), and oidcConfigRef.audience is a single string by
  # design: "MUST be unique per server to prevent token replay attacks."

# WEBUI_URL and the CERN callback carry the NodePort; `host` above stays bare
# because Gateway API rejects host:port in an HTTPRoute hostname.
publicUrl: https://archi-crab-staging.cern.ch:31393

persistence:
  enabled: true
  size: 10Gi
  storageClass: cinder-standard

bootstrap:
  enabled: true

toolServers:
  - url: "https://crab-mcp-gateway-staging.cern.ch:31393"
    path: "/mcp"
    type: "mcp"
    auth_type: "none"       # or whatever OAuth requires -- see the audience note below
    headers: null
    key: null
    config: null
    info:
      id: crab-mcp-gateway
      enabled: true
