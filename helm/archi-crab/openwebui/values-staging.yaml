env: staging
nameSuffix: "-staging"
namespace: archi-crab-staging

host: archi-crab-staging.cern.ch

gateway:
  baseName: archi-crab
  namespace: archi-crab-gw
  timeout: 3600s

# Only what differs from values.yaml -- Helm deep-merges the rest, so issuer
# and secretName are inherited. Callback to register:
#   https://archi-crab-staging.cern.ch/oauth/oidc/callback
oidc:
  clientId: archi-crab-staging


persistence:
  enabled: true
  size: 10Gi
  storageClass: cinder-standard

bootstrap:
  enabled: true

# ONE tool server: the crab-mcp-webui vMCP aggregates everything in the crab
# group, compops included (MCPServerEntry) -- the all-in-one bundle.
toolServers:
  - url: "http://vmcp-crab-mcp-webui-staging.archi-crab-staging.svc:4483"   # in-cluster; bearer token still validated by the vMCP
    path: "/mcp"
    type: "mcp"
    auth_type: "system_oauth"
    key: null
    config: {}
    info: {id: crab, enabled: true}
