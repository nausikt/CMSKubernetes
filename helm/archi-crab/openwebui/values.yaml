# SKELETON -- wiring only. You fill in the details.
#
# Reaches the MCP servers by their PUBLIC hostnames and authenticates like any
# other MCP client. No in-cluster shortcut: a shortcut to mcp-<name>-proxy:8080
# bypasses ToolHive token validation, so non-prod stops testing what prod runs (F25).
env: prod
nameSuffix: ""
namespace: archi-crab

enabled: true
image: ghcr.io/open-webui/open-webui:main

# The public hostname. WEBUI_URL, the HTTPRoute and the CERN callback all
# derive from this single value.
host: archi-crab.cern.ch

gateway:
  # The ONE shared Gateway, in the shared edge namespace.
  baseName: archi-crab
  namespace: archi-crab-gw
  timeout: 3600s

litellm:
  baseName: litellm            # resolved with nameSuffix in-namespace
  secretName: litellm-keys

# OpenWebUI has its OWN CERN client, separate from ToolHive's
# (crab-mcp-gateway[-staging]). Four confidential clients, two per environment.
# The three MCP backends have NO client and NO secret -- they verify JWT
# signatures against the public JWKS, and AUDIENCE is another client's name
# used as an expected claim value, not a credential.
#
# Register this callback at the Application Portal (no port -- Octavia LB
# serves plain :443):
#   https://archi-crab.cern.ch/oauth/oidc/callback
oidc:
  issuer: https://auth.cern.ch/auth/realms/cern
  clientId: archi-crab-production
  secretName: openwebui-idp-secret
  # offline_access must be allowed for the CERN app; if login fails with
  # invalid_scope, drop it and ask the SSO team to enable it.
  scopes: "openid email profile offline_access"


persistence:
  enabled: true
  size: 10Gi
  storageClass: cinder-standard

bootstrap:
  enabled: true

toolServers:
  # The vMCP whose audience is THIS OpenWebUI's own CERN client (archi-crab-production).
  # auth_type: system_oauth forwards the user's login token verbatim, so it must
  # hit the vMCP that validates that audience -- NOT crab-mcp-gateway[-staging],
  # which validates the public client's. Both vMCPs front the same backends.
  #
  # Field shape is ToolServerConnection (routers/configs.py). key and config
  # have no default and must be PRESENT; config MUST be {} not null, or
  # OpenWebUI crashes at startup on `'access_control' in None`.
  - url: "http://vmcp-crab-mcp-webui.archi-crab.svc:4483"   # in-cluster; bearer token still validated by the vMCP
    path: "/mcp"
    type: "mcp"
    auth_type: "system_oauth"
    key: null
    config: {}
    info:
      id: crab
      enabled: true

# THE ASSISTANT MODEL -- the user's entry point. Tools are attached to the
# MODEL, not enabled per-chat: users pick "CRAB Assistant" and the wrench menu
# is never needed. Reconciled by bootstrap-model on every sync.
model:
  id: crab-assistant
  name: "CRAB Assistant"
  base: gpt-5-luna                # must match a LiteLLM model id
  description: "CRAB operations assistant (CRAB, site status, CompOps, knowledge graph)"
  # toolServers[].info.id values to attach; the job renders server:mcp:<id>.
  tools: [crab]
  default: true                   # also set as the instance default model
  # Merged into the model's meta.capabilities (other capabilities untouched).
  # builtin_tools off: OpenWebUI's ~35 built-ins + 99 MCP tools exceed the
  # OpenAI 128-tool limit, and ask_user pre-empts the CRAB tools.
  capabilities:
    builtin_tools: false
  prompt: |
    You have access to operational tools relevant to this assistant.
    Use them when the user's request requires current external state such as
    job status, site information, logs, transfers or submission state.
    Do not announce routine tool calls.
    Prefer the smallest number of tool calls necessary; when several
    independent pieces of information are needed, call tools in parallel.
    Preserve useful operational detail from tool results -- task names, sites,
    states, exit codes, retry counts and URLs.
    Do not invent state the tools did not provide.
