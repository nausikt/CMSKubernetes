# SKELETON -- wiring only. You fill in the details.
#
# Reaches the MCP servers by their PUBLIC hostnames and authenticates like any
# other MCP client. No in-cluster shortcut: a shortcut to mcp-<name>-proxy:8080
# bypasses ToolHive token validation, so non-prod stops testing what prod runs (F25).
env: prod
nameSuffix: ""
namespace: archi-crab

enabled: true
image: ghcr.io/open-webui/open-webui:main

# ⚠ NodePort until Octavia quota lands. WEBUI_URL and the CERN callback both
#   derive from this, so the port has to be here, not appended later.
host: archi-crab.cern.ch

gateway:
  # The ONE shared Gateway, in the shared edge namespace.
  baseName: archi-crab
  namespace: archi-crab-gw
  timeout: 3600s

litellm:
  baseName: litellm            # resolved with nameSuffix in-namespace
  secretName: litellm-keys

# OpenWebUI has its OWN CERN client, separate from ToolHive's
# (crab-mcp-gateway[-staging]). Four confidential clients, two per environment.
# The three MCP backends have NO client and NO secret -- they verify JWT
# signatures against the public JWKS, and AUDIENCE is another client's name
# used as an expected claim value, not a credential.
#
# Register this callback at the Application Portal, WITH the port:
#   https://archi-crab.cern.ch:31393/oauth/oidc/callback
oidc:
  issuer: https://auth.cern.ch/auth/realms/cern
  clientId: archi-crab-production
  secretName: openwebui-idp-secret

publicUrl: https://archi-crab.cern.ch:31393

persistence:
  enabled: true
  size: 10Gi
  storageClass: cinder-standard

bootstrap:
  enabled: true

toolServers:
  # The vMCP whose audience is THIS OpenWebUI's own CERN client (archi-crab-production).
  # auth_type: system_oauth forwards the user's login token verbatim, so it must
  # hit the vMCP that validates that audience -- NOT crab-mcp-gateway[-staging],
  # which validates the public client's. Both vMCPs front the same backends.
  #
  # Field shape is ToolServerConnection (routers/configs.py). key and config
  # have no default and must be PRESENT; config MUST be {} not null, or
  # OpenWebUI crashes at startup on `'access_control' in None`.
  - url: "https://crab-mcp-webui.cern.ch:31393"
    path: "/mcp"
    type: "mcp"
    auth_type: "system_oauth"
    key: null
    config: {}
    info:
      id: crab-mcp-gateway
      enabled: true
