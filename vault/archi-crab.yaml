# Submit as an MR to CERN's Vault templates repo. NOT synced by Argo CD.
description: "K8S configuration for ARCHI-CRAB MCP gateway"
owner: "vault-admins"
environment: "testbed"              # NOT "production" -- this field routes the config

vault:
  group_name: "archi-crab-team"
  alias_name: "archi-crab-team"
  kv_path: "archi-crab"             # shallow, team-prefixed

kubernetes:
  - enable: true
    kubernetes_host: "TODO"         # kubectl config view --minify \
                                    #   -o jsonpath='{.clusters[0].cluster.server}'
    role_name: "archi-crab"
    service_account: "archi-crab-vault"
    service_account_namespaces:
      - "vault-secrets-operator"    # VSO authenticates, not your workload pods
      - "archi-crab"
      - "archi-crab-staging"
    kv_paths: ["archi-crab"]
    ttl: "24h"
    audience: "https://kubernetes.default.svc.cluster.local"

# REQUIRED. Without it the paths exist, are empty, and no human can populate them.
oidc-kerberos:
  - group_name: "cms-service-crab-operators-admins"
    access_type: "rw"
    kv_paths: ["archi-crab/*"]
